name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build APK
      run: |
        # यहाँ हम Cordova का इस्तेमाल करके तुम्हारी वेबसाइट को APK में बदलेंगे
        npm install -g cordova
        cordova create app com.raxi.king RaxiKing
        cd app
        rm -rf www/*
        cp -r ../public/* www/
        cordova platform add android
        cordova build android
    - name: Upload APK
      uses: actions/upload-artifact@v2
      with:
        name: app-debug
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk